name: Build and Push Docker Images to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'Dockerfile.smolvla'
      - '.github/workflows/docker-build-push.yml'
  workflow_dispatch: # Allows manual trigger from the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_OPENVLA: cajifan/disentangledvla-openvla
  IMAGE_NAME_SMOLVLA: cajifan/disentangledvla-smolvla

jobs:
  build-and-push-openvla:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OpenVLA Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_OPENVLA }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


